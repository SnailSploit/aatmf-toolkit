[project]
name = "aatmf-toolkit"
version = "0.9.0"
description = "AATMF Red Teaming Toolkit — Adversarial AI safety testing framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kai Aizen", email = "kai@snailsploit.com"}]
keywords = ["ai-safety", "red-teaming", "llm-security", "adversarial-ai", "aatmf", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "httpx>=0.25",
    "typer[all]>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scipy>=1.11",
    "structlog>=24.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "coverage>=7.0",
]

[project.urls]
Homepage = "https://github.com/snailsploit/aatmf-toolkit"
Documentation = "https://snailsploit.com/aatmf"
Repository = "https://github.com/snailsploit/aatmf-toolkit"
Issues = "https://github.com/snailsploit/aatmf-toolkit/issues"

[project.scripts]
aatmf = "aatmf.cli.main:app"

[tool.setuptools.packages.find]
include = ["aatmf*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
