[project]
name = "aatmf-toolkit"
version = "1.0.0"
description = "AATMF Red Teaming Toolkit — Adversarial AI safety testing framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kai Aizen", email = "kai@snailsploit.com"}]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "httpx>=0.25",
    "typer[all]>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scipy>=1.11",
    "structlog>=24.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "coverage>=7.0",
]

[project.scripts]
aatmf = "aatmf.cli.main:app"

[tool.setuptools.packages.find]
include = ["aatmf*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
